<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Tarea</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-4">
        <div class="card shadow text-center">
            <div class="card-body">
                <h2 class="text-danger">⚠️ Eliminar Tarea</h2>
                <p class="lead">¿Estás seguro de que quieres eliminar esta tarea?</p>
                <h4 class="text-dark">{{ task.title }}</h4>
                <p class="text-muted">{{ task.description }}</p>

                <form method="POST" class="mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">🗑️ Sí, eliminar</button>
                    <a href="{% url 'task_list' %}" class="btn btn-secondary">⬅️ Cancelar</a>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
